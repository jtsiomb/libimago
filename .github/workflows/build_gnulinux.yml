name: GNU/Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: install imago dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libpng-dev libjpeg-dev

    - name: configure
      run: ./configure --enable-opt --prefix=$(pwd)/staging/imago2-gnulinux

    - name: build
      run: make

    - name: stage install
      run: |
        make install
        tree staging

    - uses: actions/upload-artifact@v4
      with:
          name: imago2-gnulinux
          path: staging

